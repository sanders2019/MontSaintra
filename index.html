<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mont-Saintra | Fleet Management</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --accent: #0091FF;
  --accent-dark: #0073CC;
  --bg: #ffffff;
  --text: #000000;
  --border: #000000;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { 
  font-family: 'Segoe UI', system-ui, sans-serif; 
  background: var(--bg); 
  color: var(--text); 
  min-height: 100vh; 
  overflow: hidden;
}

#login-screen {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: white;
  z-index: 1000;
}

.login-box {
  width: 360px;
  padding: 40px 30px;
  border: 3px solid #000;
  border-radius: 12px;
  text-align: center;
}

.login-box h1 {
  font-size: 28px;
  margin-bottom: 8px;
}

.login-box h1 span {
  color: var(--accent);
}

.login-input {
  width: 100%;
  padding: 14px;
  margin: 12px 0;
  border: 2px solid #000;
  border-radius: 8px;
  font-size: 16px;
}

.btn {
  width: 100%;
  padding: 14px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 10px;
}

.btn:hover {
  background: var(--accent-dark);
}

.error {
  color: #d32f2f;
  margin-top: 10px;
  font-weight: 600;
  display: none;
}

/* Main App */
#app {
  display: none;
  height: 100vh;
}

#app.active {
  display: flex;
}

.sidebar {
  width: 260px;
  background: white;
  border-right: 3px solid #000;
  display: flex;
  flex-direction: column;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.topbar {
  padding: 16px 24px;
  border-bottom: 3px solid #000;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: white;
}

.content {
  flex: 1;
  padding: 24px;
  overflow-y: auto;
  background: #fafafa;
}

/* Cards */
.card {
  background: white;
  border: 3px solid #000;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
}

h2 {
  margin-bottom: 16px;
  font-size: 24px;
}

button {
  cursor: pointer;
}

/* Toast */
#toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #000;
  color: white;
  padding: 14px 20px;
  border-radius: 8px;
  border: 2px solid #000;
  display: none;
  z-index: 2000;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h1>Mont-<span>Saintra</span></h1>
    <p style="margin:8px 0 20px;color:#555;">Fleet Management</p>
    
    <input type="text" id="username" class="login-input" placeholder="Username" autocomplete="off">
    <input type="password" id="password" class="login-input" placeholder="Password">
    
    <button class="btn" onclick="login()">LOGIN</button>
    <div id="login-error" class="error">Invalid username or password</div>
    
    <div style="margin-top:30px;font-size:12px;color:#666;">
      Default Admin:<br>
      <strong>username:</strong> admin<br>
      <strong>password:</strong> admin123
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <div class="sidebar">
    <div style="padding:20px;border-bottom:3px solid #000;">
      <h2 style="font-size:22px;">Mont-<span style="color:var(--accent)">Saintra</span></h2>
    </div>
    
    <div onclick="goTo('dashboard')" style="padding:16px 20px;border-bottom:2px solid #eee;cursor:pointer;" id="nav-dashboard">
      📊 Dashboard
    </div>
    <div onclick="goTo('team')" style="padding:16px 20px;border-bottom:2px solid #eee;cursor:pointer;" id="nav-team">
      👥 Team Management
    </div>
    <div onclick="goTo('tasks')" style="padding:16px 20px;border-bottom:2px solid #eee;cursor:pointer;" id="nav-tasks">
      📋 Assign Tasks
    </div>
    <div onclick="goTo('map')" style="padding:16px 20px;border-bottom:2px solid #eee;cursor:pointer;" id="nav-map">
      🗺️ Live Map
    </div>
    <div onclick="goTo('profile')" style="padding:16px 20px;border-bottom:2px solid #eee;cursor:pointer;" id="nav-profile">
      ⚙️ Profile
    </div>
    
    <div style="margin-top:auto;padding:20px;">
      <button onclick="logout()" style="width:100%;padding:12px;background:#fff;border:2px solid #000;border-radius:8px;cursor:pointer;">
        Sign Out
      </button>
    </div>
  </div>
  
  <div class="main">
    <div class="topbar">
      <h2 id="page-title">Fleet Operations Center</h2>
      <div id="current-user" style="font-weight:500;"></div>
    </div>
    
    <div class="content" id="main-content">
      <!-- Content loaded by JS -->
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
// ============== DATA & STATE ==============
let currentUser = null;
let users = {
  admin: {password: "admin123", role: "admin", name: "Administrator"}
};

let drivers = [];
let tasks = [];
let messages = [];

// Load from localStorage
function loadData() {
  const savedUsers = localStorage.getItem('mont_users');
  if (savedUsers) users = JSON.parse(savedUsers);
  
  const savedDrivers = localStorage.getItem('mont_drivers');
  if (savedDrivers) drivers = JSON.parse(savedDrivers);
  
  const savedTasks = localStorage.getItem('mont_tasks');
  if (savedTasks) tasks = JSON.parse(savedTasks);
  
  const savedMessages = localStorage.getItem('mont_messages');
  if (savedMessages) messages = JSON.parse(savedMessages);
}

function saveData() {
  localStorage.setItem('mont_users', JSON.stringify(users));
  localStorage.setItem('mont_drivers', JSON.stringify(drivers));
  localStorage.setItem('mont_tasks', JSON.stringify(tasks));
  localStorage.setItem('mont_messages', JSON.stringify(messages));
}

// ============== LOGIN ==============
function login() {
  const username = document.getElementById('username').value.trim().toLowerCase();
  const password = document.getElementById('password').value.trim();
  const errorEl = document.getElementById('login-error');

  if (users[username] && users[username].password === password) {
    currentUser = {username, ...users[username]};
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').classList.add('active');
    document.getElementById('current-user').textContent = currentUser.name;
    loadDashboard();
  } else {
    errorEl.style.display = 'block';
    setTimeout(() => errorEl.style.display = 'none', 3000);
  }
}

function logout() {
  currentUser = null;
  document.getElementById('app').classList.remove('active');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('username').value = '';
  document.getElementById('password').value = '';
}

// ============== NAVIGATION ==============
function goTo(page) {
  document.querySelectorAll('.sidebar > div').forEach(el => {
    if (el.style) el.style.background = '';
  });
  
  const nav = document.getElementById('nav-' + page);
  if (nav) nav.style.background = '#f0f0f0';
  
  const content = document.getElementById('main-content');
  
  if (page === 'dashboard') loadDashboard();
  else if (page === 'team') loadTeamPage();
  else if (page === 'tasks') loadTasksPage();
  else if (page === 'map') loadMapPage();
  else if (page === 'profile') loadProfilePage();
}

function loadDashboard() {
  const content = document.getElementById('main-content');
  content.innerHTML = `
    <h2>Fleet Operations Center</h2>
    <p style="color:#666;margin-bottom:24px;">Welcome back, ${currentUser.name}</p>
    
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;">
      <div style="border:3px solid #000;padding:20px;border-radius:12px;">
        <h3 style="margin-bottom:8px;">📊 Quick Stats</h3>
        <p><strong>${drivers.length}</strong> Team Members</p>
        <p><strong>${tasks.filter(t=>!t.completed).length}</strong> Pending Tasks</p>
      </div>
      
      <div onclick="goTo('team')" style="border:3px solid #000;padding:20px;border-radius:12px;cursor:pointer;">
        <h3 style="margin-bottom:8px;">👥 Add Team Member</h3>
        <p>Add drivers or assistants with auto-generated credentials</p>
      </div>
      
      <div onclick="goTo('tasks')" style="border:3px solid #000;padding:20px;border-radius:12px;cursor:pointer;">
        <h3 style="margin-bottom:8px;">📋 Assign Tasks</h3>
        <p>Create and assign tasks to your team</p>
      </div>
    </div>
    
    <div style="margin-top:30px;">
      <h3>Recent Activity</h3>
      <div id="activity-list" style="margin-top:12px;"></div>
    </div>
  `;
  renderRecentActivity();
}

function renderRecentActivity() {
  const container = document.getElementById('activity-list');
  container.innerHTML = `
    <div style="padding:14px;border:2px solid #000;border-radius:8px;margin-bottom:8px;">
      System ready. Add your first team member using the Team Management panel.
    </div>
  `;
}

// ============== TEAM MANAGEMENT ==============
function loadTeamPage() {
  const content = document.getElementById('main-content');
  content.innerHTML = `
    <h2>Team Management</h2>
    <button onclick="addTeamMember()" style="padding:12px 24px;background:#0091FF;color:white;border:none;border-radius:8px;margin-bottom:20px;cursor:pointer;">
      + Add Driver or Assistant
    </button>
    
    <div id="team-list"></div>
  `;
  renderTeamList();
}

function addTeamMember() {
  const name = prompt("Enter full name:");
  if (!name) return;
  
  const role = confirm("Is this a Driver? (Cancel for Assistant)") ? "driver" : "assistant";
  
  const username = name.toLowerCase().replace(/\s/g,'') + Math.floor(Math.random()*90+10);
  const password = "pass" + Math.floor(1000 + Math.random()*9000);
  
  const newUser = {
    password: password,
    role: role,
    name: name,
    driverId: 'M' + Date.now().toString().slice(-4)
  };
  
  users[username] = newUser;
  saveData();
  
  alert(`✅ Team Member Created!\n\nName: ${name}\nRole: ${role}\nUsername: ${username}\nPassword: ${password}\n\nPlease save these credentials.`);
  
  renderTeamList();
}

function renderTeamList() {
  const container = document.getElementById('team-list');
  let html = '<h3>Current Team</h3>';
  
  Object.keys(users).forEach(key => {
    const u = users[key];
    if (key !== 'admin') {
      html += `
        <div style="border:2px solid #000;padding:16px;margin:8px 0;border-radius:8px;display:flex;justify-content:space-between;align-items:center;">
          <div>
            <strong>${u.name}</strong> (${u.role})<br>
            <small>Username: ${key} | Password: ${u.password}</small>
          </div>
          <button onclick="deleteUser('${key}')" style="padding:6px 12px;background:#ff4444;color:white;border:none;border-radius:4px;">Remove</button>
        </div>`;
    }
  });
  
  container.innerHTML = html || '<p>No team members yet.</p>';
}

function deleteUser(username) {
  if (confirm("Remove this user?")) {
    delete users[username];
    saveData();
    renderTeamList();
  }
}

// ============== OTHER PAGES ==============
function loadTasksPage() {
  const content = document.getElementById('main-content');
  content.innerHTML = `
    <h2>Task Assignment</h2>
    <button onclick="createTask()" style="padding:12px 24px;background:#0091FF;color:white;border:none;border-radius:8px;margin-bottom:20px;cursor:pointer;">
      + Create New Task
    </button>
    <div id="task-list" style="margin-top:10px;"></div>
  `;
  renderTasks();
}

function createTask() {
  const title = prompt("Task title:");
  if (!title) return;
  const assignee = prompt("Assign to username:");
  
  tasks.push({
    id: Date.now(),
    title: title,
    assignedTo: assignee,
    completed: false,
    createdAt: new Date().toISOString()
  });
  
  saveData();
  renderTasks();
}

function renderTasks() {
  const container = document.getElementById('task-list');
  container.innerHTML = tasks.map(t => `
    <div style="padding:16px;border:2px solid #000;border-radius:8px;margin-bottom:8px;">
      <strong>${t.title}</strong><br>
      Assigned to: ${t.assignedTo}<br>
      Status: ${t.completed ? '✅ Completed' : '⏳ Pending'}
    </div>
  `).join('') || '<p>No tasks yet.</p>';
}

function loadMapPage() {
  const content = document.getElementById('main-content');
  content.innerHTML = `
    <h2>Live Fleet Map</h2>
    <div style="background:#ddd;height:500px;display:flex;align-items:center;justify-content:center;border:3px solid #000;border-radius:12px;">
      <div style="text-align:center;">
        <h3>🗺️ Interactive Map</h3>
        <p>3 vehicles with active destinations</p>
        <p style="margin-top:20px;font-size:14px;color:#666;">
          VAN-001 → French Quarter<br>
          VAN-002 → Airport Terminal<br>
          VAN-003 → Downtown Hub
        </p>
      </div>
    </div>
  `;
}

function loadProfilePage() {
  const content = document.getElementById('main-content');
  content.innerHTML = `
    <h2>Profile Settings</h2>
    <div style="max-width:500px;">
      <div style="padding:20px;border:3px solid #000;border-radius:12px;">
        <h3>Change Password</h3>
        <input type="password" id="newpass" placeholder="New Password" style="width:100%;padding:12px;margin:10px 0;border:2px solid #000;border-radius:6px;"><br>
        <button onclick="changePassword()" style="padding:12px 30px;background:#000;color:white;border:none;border-radius:6px;cursor:pointer;">Update Password</button>
      </div>
    </div>
  `;
}

function changePassword() {
  const newPass = document.getElementById('newpass').value;
  if (newPass && currentUser) {
    users[currentUser.username].password = newPass;
    saveData();
    alert("Password updated successfully!");
  }
}

// ============== UTILITIES ==============
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.style.display = 'block';
  setTimeout(() => toast.style.display = 'none', 2500);
}

// Initialize
loadData();
if (!users.admin) {
  users.admin = {password: "admin123", role: "admin", name: "Administrator"};
  saveData();
}
</script>
</body>
</html>
