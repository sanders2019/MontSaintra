<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="login-container">
    <div class="login-logo">
      <h1>Mont-<span>Saintra</span></h1>
      <p>Fleet • Payroll • Operations</p>
    </div>
    <div class="login-inputs">
      <div class="form-group">
        <input type="text" id="login-username" placeholder="Username" autocomplete="username">
      </div>
      <div class="form-group">
        <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
      </div>
      <button class="btn-login" onclick="doLogin()">Sign In</button>
      <div class="login-error" id="login-error"></div>
    </div>
    <div class="login-hint">
      <strong>Admin Login Only</strong><br>
      Contact administrator for driver credentials
    </div>
  </div>
</div>

<!-- WELCOME -->
<div id="welcome-section">
  <div class="welcome-heading">Welcome to Mont-Saintra</div>
  <div class="spiral-container">
    <div class="spiral-shape"></div>
    <div class="spiral-shape"></div>
    <div class="spiral-shape"></div>
  </div>
  <p style="color:#666;font-size:15px;">Loading Fleet Operations...</p>
</div>

<!-- MAIN APP -->
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>Mont-<span>Saintra</span></h2>
    </div>
    <div class="sidebar-user" id="sidebar-user" onclick="navigateTo('profile')">
      <div class="user-avatar" id="sidebar-avatar">A</div>
      <div class="user-info">
        <div class="name" id="sidebar-name">Administrator</div>
        <div class="role" id="sidebar-role">SYSTEM ADMIN</div>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <button class="btn-logout" onclick="doLogout()">
        <i class="fas fa-sign-out-alt"></i> Sign Out
      </button>
    </div>
  </aside>

  <div class="main-content">
    <div class="topbar">
      <h3 id="topbar-title"><i class="fas fa-gauge-high"></i> Dashboard</h3>
      <div class="topbar-right">
        <span class="live-badge"><span class="status-dot"></span>LIVE TRACKING</span>
        <span id="topbar-time" style="font-size:14px;color:#666"></span>
      </div>
    </div>
    <div class="content-area" id="content-area"></div>
  </div>
</div>

<!-- MODALS -->
<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal" id="modal-content"></div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
// ==================== CONFIG & DATA ====================
const USERS = {
  admin: {password:'admin123',role:'admin',name:'Administrator',email:'admin@montsaintra.com'},
  driver1: {password:'driver123',role:'driver',name:'Driver One',driverId:'D1',email:'driver1@montsaintra.com'},
  driver2: {password:'driver123',role:'driver',name:'Driver Two',driverId:'D2',email:'driver2@montsaintra.com'},
  driver3: {password:'driver123',role:'driver',name:'Driver Three',driverId:'D3',email:'driver3@montsaintra.com'}
};

const BASE_COORDS = [
  {lat:29.9511,lng:-90.0715},
  {lat:29.9627,lng:-90.0817},
  {lat:29.9401,lng:-90.0580}
];

const HOURLY_RATE = 22;

let currentUser = null;
let mapInstance = null;
let mapMarkers = {};
let mapUpdateInterval = null;
let clockInterval = null;
let sessionTimer = null;
let currentPayrollPeriod = 'week';
let payrollChart = null;
let currentTaskTab = 'all';
let currentMessageTab = 'inbox';
let userProfiles = {};

// LocalStorage helpers
function ls(key, def = null) {
  try {
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : def;
  } catch(e) { return def; }
}

function lsSet(key, val) {
  localStorage.setItem(key, JSON.stringify(val));
}

// Initialize empty data (NO MOCK DATA)
function initData() {
  if (!ls('ftp_initialized', false)) {
    lsSet('ftp_drivers', []);
    lsSet('ftp_vans', [
      {id:'V1', license:'VAN-001', color:'gray', lat:BASE_COORDS[0].lat, lng:BASE_COORDS[0].lng},
      {id:'V2', license:'VAN-002', color:'gray', lat:BASE_COORDS[1].lat, lng:BASE_COORDS[1].lng},
      {id:'V3', license:'VAN-003', color:'gray', lat:BASE_COORDS[2].lat, lng:BASE_COORDS[2].lng}
    ]);
    lsSet('ftp_timelogs', []);
    lsSet('ftp_tasks', []);
    lsSet('ftp_messages', []);
    lsSet('ftp_initialized', true);
  }
  
  userProfiles = ls('ftp_profiles', {});
  if (!userProfiles.admin) {
    userProfiles.admin = {
      fullName: 'Administrator',
      email: 'admin@montsaintra.com',
      phone: '(504) 555-0192',
      department: 'Operations',
      role: 'System Administrator',
      notificationsEnabled: true,
      theme: 'light',
      avatar: '👔'
    };
    lsSet('ftp_profiles', userProfiles);
  }

  // Load persistent users if available
  const savedUsers = ls('ftp_users', {});
  Object.keys(savedUsers).forEach(key => {
    if (USERS[key]) {
      USERS[key] = {...USERS[key], ...savedUsers[key]};
    }
  });
}

function getDrivers() { return ls('ftp_drivers', []); }
function getVans() { return ls('ftp_vans', []); }
function getTimeLogs() { return ls('ftp_timelogs', []); }
function getTasks() { return ls('ftp_tasks', []); }
function getMessages() { return ls('ftp_messages', []); }

function saveDrivers(d) { lsSet('ftp_drivers', d); }
function saveVans(v) { lsSet('ftp_vans', v); }
function saveTimeLogs(t) { lsSet('ftp_timelogs', t); }
function saveTasks(t) { lsSet('ftp_tasks', t); }
function saveMessages(m) { lsSet('ftp_messages', m); }

// ==================== AUTH ====================
function doLogin() {
  const u = document.getElementById('login-username').value.trim().toLowerCase();
  const p = document.getElementById('login-password').value.trim();
  const err = document.getElementById('login-error');

  if (USERS[u] && USERS[u].password === p) {
    err.style.display = 'none';
    currentUser = {username: u, ...USERS[u]};
    lsSet('ftp_session', currentUser);
    showWelcome();
  } else {
    err.style.display = 'block';
    err.textContent = 'Invalid username or password.';
  }
}

function doLogout() {
  clearIntervals();
  localStorage.removeItem('ftp_session');
  currentUser = null;
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app').classList.remove('active');
  document.getElementById('welcome-section').classList.remove('active');
  document.getElementById('login-username').value = '';
  document.getElementById('login-password').value = '';
  if (mapInstance) { mapInstance.remove(); mapInstance = null; }
  payrollChart = null;
}

function clearIntervals() {
  if (mapUpdateInterval) clearInterval(mapUpdateInterval);
  if (clockInterval) clearInterval(clockInterval);
  if (sessionTimer) clearInterval(sessionTimer);
  mapUpdateInterval = clockInterval = sessionTimer = null;
}

// ==================== UI NAVIGATION ====================
function showWelcome() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('welcome-section').classList.add('active');
  document.getElementById('app').classList.add('active');
  
  document.getElementById('sidebar-name').textContent = currentUser.name;
  document.getElementById('sidebar-avatar').textContent = currentUser.name.charAt(0).toUpperCase();
  document.getElementById('sidebar-role').textContent = currentUser.role === 'admin' ? 'SYSTEM ADMIN' : 'DRIVER';

  buildNav();
  startTopbarClock();

  setTimeout(() => {
    document.getElementById('welcome-section').classList.remove('active');
    if (currentUser.role === 'admin') {
      navigateTo('overview');
    } else {
      navigateTo('driver-dashboard');
    }
  }, 2200);
}

function startTopbarClock() {
  function update() {
    document.getElementById('topbar-time').textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }
  update();
  sessionTimer = setInterval(update, 10000);
}

const ADMIN_NAV = [
  {id:'overview',icon:'fas fa-gauge-high',label:'Overview'},
  {id:'map',icon:'fas fa-map-location-dot',label:'Live Map'},
  {id:'drivers',icon:'fas fa-id-card',label:'Drivers'},
  {id:'users',icon:'fas fa-users-cog',label:'Credentials'},
  {id:'timelogs',icon:'fas fa-clock',label:'Time Logs'},
  {id:'payroll',icon:'fas fa-dollar-sign',label:'Payroll'},
  {id:'tasks',icon:'fas fa-tasks',label:'Assign Tasks'},
  {id:'messages',icon:'fas fa-envelope',label:'Messages'},
  {id:'profile',icon:'fas fa-user-gear',label:'My Profile'}
];

const DRIVER_NAV = [
  {id:'driver-dashboard',icon:'fas fa-house',label:'Dashboard'},
  {id:'timeclock',icon:'fas fa-fingerprint',label:'Time Clock'},
  {id:'mytimelog',icon:'fas fa-list-check',label:'My Time Log'},
  {id:'mypay',icon:'fas fa-wallet',label:'My Pay'},
  {id:'mytasks',icon:'fas fa-tasks',label:'My Tasks'},
  {id:'mymessages',icon:'fas fa-envelope',label:'Messages'}
];

function buildNav() {
  const nav = document.getElementById('sidebar-nav');
  nav.innerHTML = '';
  const items = currentUser.role === 'admin' ? ADMIN_NAV : DRIVER_NAV;
  
  items.forEach(item => {
    nav.innerHTML += `
      <div class="nav-item" id="nav-${item.id}" onclick="navigateTo('${item.id}')">
        <i class="${item.icon}"></i>${item.label}
      </div>`;
  });
}

function navigateTo(id) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const navEl = document.getElementById('nav-'+id);
  if (navEl) navEl.classList.add('active');

  const titles = {
    overview:'Overview', map:'Live Fleet Map', drivers:'Driver Management', 
    users:'User Credentials', timelogs:'Time Logs', payroll:'Payroll Center',
    tasks:'Task Assignment', messages:'Communications', profile:'Profile Settings',
    'driver-dashboard':'Driver Dashboard', timeclock:'Time Clock', mytimelog:'My Activity',
    mypay:'My Earnings', mytasks:'Assigned Tasks', mymessages:'Messages'
  };

  document.getElementById('topbar-title').innerHTML = `<i class="fas ${getTitleIcon(id)}" style="margin-right:10px"></i>${titles[id]||id}`;

  if (id !== 'map' && mapUpdateInterval) {
    clearInterval(mapUpdateInterval);
    mapUpdateInterval = null;
  }

  const content = document.getElementById('content-area');
  content.innerHTML = '';

  switch(id) {
    case 'overview': renderAdminOverview(); break;
    case 'map': renderMap(); break;
    case 'drivers': renderDrivers(); break;
    case 'users': renderUserCredentials(); break;
    case 'timelogs': renderTimeLogs(); break;
    case 'payroll': renderPayroll(); break;
    case 'tasks': renderAdminTasks(); break;
    case 'messages': renderAdminMessages(); break;
    case 'profile': renderProfileSettings(); break;
    case 'driver-dashboard': renderDriverDashboard(); break;
    case 'timeclock': renderTimeClock(); break;
    case 'mytimelog': renderMyTimelog(); break;
    case 'mypay': renderMyPay(); break;
    case 'mytasks': renderDriverTasks(); break;
    case 'mymessages': renderDriverMessages(); break;
  }
}

function getTitleIcon(id) {
  const icons = {overview:'fa-gauge-high',map:'fa-map-location-dot',drivers:'fa-id-card',users:'fa-users-cog',timelogs:'fa-clock',payroll:'fa-dollar-sign',tasks:'fa-tasks',messages:'fa-envelope','driver-dashboard':'fa-house',timeclock:'fa-fingerprint',profile:'fa-user-gear',mytimelog:'fa-list-check',mypay:'fa-wallet',mytasks:'fa-tasks',mymessages:'fa-envelope'};
  return icons[id] || 'fa-circle';
}

// ==================== PROFILE ====================
function renderProfileSettings() {
  const content = document.getElementById('content-area');
  const profile = userProfiles[currentUser.username] || {
    fullName: currentUser.name,
    email: currentUser.email || '',
    phone: '',
    department: 'Operations',
    role: currentUser.role === 'admin' ? 'System Administrator' : 'Fleet Driver',
    notificationsEnabled: true,
    theme: 'light',
    avatar: '👤'
  };

  content.innerHTML = `
    <div class="profile-section">
      <div class="profile-header">
        <div class="profile-avatar-upload" onclick="document.getElementById('avatar-input').click()">
          ${profile.avatar || currentUser.name.charAt(0)}
          <input type="file" id="avatar-input" accept="image/*" onchange="handleAvatarChange(event)">
        </div>
        <div class="profile-info">
          <h2>${profile.fullName}</h2>
          <p>${currentUser.role === 'admin' ? 'System Administrator' : 'Fleet Operator'}</p>
          <span class="profile-status-badge">ACTIVE</span>
        </div>
      </div>

      <div class="card">
        <div class="card-title"><i class="fas fa-user"></i>Personal Information</div>
        <div class="profile-form">
          <div class="profile-form-group"><label>Full Name</label><input type="text" id="profile-fullname" value="${profile.fullName}"></div>
          <div class="profile-form-group"><label>Email Address</label><input type="email" id="profile-email" value="${profile.email}"></div>
          <div class="profile-form-group"><label>Phone Number</label><input type="tel" id="profile-phone" value="${profile.phone}"></div>
          <div class="profile-form-group"><label>Department</label><input type="text" id="profile-department" value="${profile.department}"></div>
          <div class="profile-form-group profile-form-full"><label>Role</label><input type="text" value="${profile.role}" disabled></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title"><i class="fas fa-sliders"></i>Preferences</div>
        <div class="preferences-section">
          <div class="preference-item">
            <div class="preference-label">
              <span class="title">Email Notifications</span>
              <span class="desc">Receive updates on fleet activity and approvals</span>
            </div>
            <div class="toggle-switch ${profile.notificationsEnabled?'active':''}" id="notifications-toggle" onclick="toggleNotifications()">
              <div class="toggle-switch-knob"></div>
            </div>
          </div>
          <div class="preference-item">
            <div class="preference-label">
              <span class="title">Display Theme</span>
              <span class="desc">Interface appearance</span>
            </div>
            <select id="profile-theme">
              <option value="light" ${profile.theme==='light'?'selected':''}>Light Theme</option>
              <option value="dark" ${profile.theme==='dark'?'selected':''}>Dark Theme</option>
            </select>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title"><i class="fas fa-lock"></i>Security</div>
        <button class="btn-primary" onclick="openChangePasswordModal()"><i class="fas fa-key"></i> Change Password</button>
      </div>

      <div class="profile-actions">
        <button class="btn-secondary" onclick="resetProfileForm()">Cancel</button>
        <button class="btn-primary" onclick="saveProfileSettings()"><i class="fas fa-save"></i> Save Profile</button>
      </div>
    </div>`;
}

function handleAvatarChange(e) {
  if (e.target.files[0]) {
    showToast('Profile picture updated (visible after refresh)');
  }
}

function toggleNotifications() {
  const toggle = document.getElementById('notifications-toggle');
  toggle.classList.toggle('active');
}

function openChangePasswordModal() {
  showModal(`
    <h3><i class="fas fa-lock"></i>Change Password</h3>
    <div class="form-field"><label>Current Password</label><input id="m-current-pwd" type="password"></div>
    <div class="form-field"><label>New Password</label><input id="m-new-pwd" type="password"></div>
    <div class="form-field"><label>Confirm New Password</label><input id="m-confirm-pwd" type="password"></div>
    <div class="modal-actions">
      <button class="btn-primary" onclick="updatePassword()">Update Password</button>
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
    </div>`);
}

function updatePassword() {
  const current = document.getElementById('m-current-pwd').value;
  const newPwd = document.getElementById('m-new-pwd').value;
  const confirm = document.getElementById('m-confirm-pwd').value;

  if (current !== USERS[currentUser.username].password) {
    showToast('Current password incorrect', 'error');
    return;
  }
  if (!newPwd || newPwd.length < 6) {
    showToast('Password must be at least 6 characters', 'error');
    return;
  }
  if (newPwd !== confirm) {
    showToast('Passwords do not match', 'error');
    return;
  }

  // Save password change persistently
  USERS[currentUser.username].password = newPwd;
  
  // Also update in localStorage if we have a persistent users store
  let savedUsers = ls('ftp_users', {});
  savedUsers[currentUser.username] = USERS[currentUser.username];
  lsSet('ftp_users', savedUsers);

  closeModal();
  showToast('Password updated successfully and saved');
}


function saveProfileSettings() {
  const profile = {
    fullName: document.getElementById('profile-fullname').value || currentUser.name,
    email: document.getElementById('profile-email').value,
    phone: document.getElementById('profile-phone').value,
    department: document.getElementById('profile-department').value,
    role: currentUser.role === 'admin' ? 'System Administrator' : 'Fleet Driver',
    notificationsEnabled: document.getElementById('notifications-toggle').classList.contains('active'),
    theme: document.getElementById('profile-theme').value,
    avatar: currentUser.name.charAt(0)
  };

  userProfiles[currentUser.username] = profile;
  lsSet('ftp_profiles', userProfiles);
  currentUser.name = profile.fullName;
  document.getElementById('sidebar-name').textContent = profile.fullName;
  
  showToast('Profile saved successfully');
  renderProfileSettings();
}

function resetProfileForm() {
  renderProfileSettings();
}

// ==================== DASHBOARD RENDERERS ====================
function renderAdminOverview() {
  const drivers = getDrivers();
  const logs = getTimeLogs();
  const tasks = getTasks();
  const now = new Date();
  const weekStart = getWeekStart(now);
  const weekLogs = logs.filter(l => new Date(l.punchIn) >= weekStart);
  const totalHours = weekLogs.reduce((s,l) => s + parseFloat(l.hours||0), 0);
  const totalPayroll = weekLogs.reduce((s,l) => {
    const d = drivers.find(x=>x.id===l.driverId);
    return s + parseFloat(l.hours||0) * (d ? d.hourlyRate : HOURLY_RATE);
  }, 0);
  const activeNow = drivers.filter(d => d.status === 'in').length;

  const content = document.getElementById('content-area');
  content.innerHTML = `
    <div class="welcome-card">
      <div class="w-icon"><i class="fas fa-truck"></i></div>
      <div>
        <h2>Welcome back, Administrator</h2>
        <p>${now.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric', year:'numeric'})}</p>
      </div>
    </div>

function renderMap() {
  const content = document.getElementById('content-area');
  content.innerHTML = `
    <div class="van-status-grid" id="van-status-cards"></div>
    <div class="card" style="padding:0;overflow:hidden;">
      <div id="map-container"></div>
    </div>
    <div class="map-legend">
      <div class="legend-item"><div class="legend-dot" style="background:#666666"></div>VAN-001</div>
      <div class="legend-item"><div class="legend-dot" style="background:#777777"></div>VAN-002</div>
      <div class="legend-item"><div class="legend-dot" style="background:#888888"></div>VAN-003</div>
    </div>`;

  renderVanStatusCards();

  setTimeout(() => {
    if (mapInstance) mapInstance.remove();
    
    mapInstance = L.map('map-container').setView([29.9511, -90.0715], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(mapInstance);

    const vans = getVans();
    const drivers = getDrivers();
    
    vans.forEach(van => {
      const driver = drivers.find(d => d.vanId === van.id);
      const color = driver && driver.status === 'in' ? '#0091FF' : '#666666';
      
      const icon = L.divIcon({
        className: '',
        html: `<div style="background:${color};width:42px;height:42px;border-radius:50%;border:3px solid white;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px rgba(0,0,0,0.4);font-size:18px;">🚐</div>`,
        iconSize: [46, 46],
        iconAnchor: [23, 23]
      });

      const marker = L.marker([van.lat, van.lng], {icon}).addTo(mapInstance);
      marker.bindPopup(`<b>${van.license}</b><br>${driver ? driver.name : 'Unassigned'}`);
      mapMarkers[van.id] = marker;
    });

    mapUpdateInterval = setInterval(() => {
      simulateVanMovement();
      renderVanStatusCards();
    }, 25000);
  }, 100);
}

function simulateVanMovement() {
  const vans = getVans();
  const drivers = getDrivers();
  
  vans.forEach(van => {
    const driver = drivers.find(d => d.vanId === van.id);
    if (driver && driver.status === 'in') {
      van.lat += (Math.random() - 0.5) * 0.004;
      van.lng += (Math.random() - 0.5) * 0.004;
      if (mapMarkers[van.id]) {
        mapMarkers[van.id].setLatLng([van.lat, van.lng]);
      }
    }
  });
  saveVans(vans);
}

function renderVanStatusCards() {
  const el = document.getElementById('van-status-cards');
  if (!el) return;
  
  const vans = getVans();
  const drivers = getDrivers();
  el.innerHTML = '';
  
  vans.forEach(van => {
    const driver = drivers.find(d => d.vanId === van.id);
    const status = driver && driver.status === 'in' ? 'ACTIVE' : 'IDLE';
    const color = driver && driver.status === 'in' ? 'var(--accent)' : '#888';
    
    el.innerHTML += `
      <div class="van-status-card">
        <div class="van-id" style="color:${color}">${van.license}</div>
        <div class="van-driver">${driver ? driver.name : 'Unassigned'}</div>
        <span class="badge ${driver&&driver.status==='in'?'badge-active':'badge-idle'}">${status}</span>
      </div>`;
  });
}

// ==================== UTILITY FUNCTIONS ====================
function getWeekStart(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  d.setDate(diff);
  d.setHours(0,0,0,0);
  return d;
}

function fmtDt(ts) {
  if (!ts) return '—';
  return new Date(ts).toLocaleString('en-US', {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
}

function showModal(html) {
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
}

let toastTimeout;
function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.borderColor = type === 'error' ? '#d32f2f' : '#000000';
  t.classList.add('show');
  if (toastTimeout) clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => t.classList.remove('show'), 2800);
}

    <div class="form-field"><label>Task Title</label><input id="task-title" type="text" placeholder="Deliver packages to warehouse"></div>

      <div class="form-field"><label>Assign To</label>
        <select id="task-assignee">
          ${drivers.length ? drivers.map(d => `<option value="${d.id}">${d.name}</option>`).join('') : '<option value="">No drivers yet</option>'}
        </select>

    </div>

}

function saveNewTask() {
  const title = document.getElementById('task-title').value.trim();
  const description = document.getElementById('task-desc').value.trim();
  const assignedTo = document.getElementById('task-assignee').value;
  const dueDate = document.getElementById('task-due').value;

  if (!title || !assignedTo || !dueDate) {
    showToast('Please fill all fields', 'error');
    return;
  }

  const tasks = getTasks();
  tasks.push({
    id: 'T' + Date.now(),
    title,
    description,
    assignedTo,
    dueDate,
    completed: false,
    createdAt: Date.now()
  });

  saveTasks(tasks);
  closeModal();
  renderAdminTasks();
  showToast('Task created successfully');
}

function editTask(taskId) {
  const tasks = getTasks();
  const task = tasks.find(t => t.id === taskId);
  if (!task) return;

  const drivers = getDrivers();
  showModal(`
    <h3><i class="fas fa-edit"></i> Edit Task</h3>
    <div class="form-field"><label>Title</label><input id="edit-title" value="${task.title}"></div>
    <div class="form-field"><label>Description</label><textarea id="edit-desc" style="height:90px;">${task.description||''}</textarea></div>
    <div class="form-row">
      <div class="form-field"><label>Assign To</label>
        <select id="edit-assignee">
          ${drivers.map(d => `<option value="${d.id}" ${d.id===task.assignedTo?'selected':''}>${d.name}</option>`).join('')}
        </select>
      </div>
      <div class="form-field"><label>Due Date</label><input id="edit-due" type="date" value="${task.dueDate}"></div>
    </div>
    <div class="form-field"><label>Status</label>
      <select id="edit-status">
        <option value="false" ${!task.completed?'selected':''}>Pending</option>
        <option value="true" ${task.completed?'selected':''}>Completed</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-primary" onclick="saveEditedTask('${taskId}')">Save Changes</button>
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
    </div>
  `);
}

function saveEditedTask(taskId) {
  const tasks = getTasks();
  const idx = tasks.findIndex(t => t.id === taskId);
  if (idx === -1) return;

  tasks[idx].title = document.getElementById('edit-title').value;
  tasks[idx].description = document.getElementById('edit-desc').value;
  tasks[idx].assignedTo = document.getElementById('edit-assignee').value;
  tasks[idx].dueDate = document.getElementById('edit-due').value;
  tasks[idx].completed = document.getElementById('edit-status').value === 'true';

  saveTasks(tasks);
  closeModal();
  renderAdminTasks();
  showToast('Task updated');
}

function deleteTask(taskId) {
  if (!confirm('Delete this task?')) return;
  const tasks = getTasks().filter(t => t.id !== taskId);
  saveTasks(tasks);
  renderAdminTasks();
  showToast('Task deleted');
}

function renderDriverTasksList() {

    container.innerHTML = `<div class="empty-state"><i class="fas fa-clipboard-check"></i><p>No tasks assigned yet.</p></div>`;

  container.innerHTML = tasks.map(t => {

    return `
      <div class="task-item">
        <div class="task-content">

          <div class="task-desc">${t.description || 'No description provided'}</div>

            ${t.completed ? 'Undo' : 'Mark Complete'}
          </button>
        </div>
      </div>`;
  }).join('');
}

function toggleDriverTask(taskId) {
  const tasks = getTasks();
  const task = tasks.find(t => t.id === taskId);
  if (!task) return;
  
  task.completed = !task.completed;
  saveTasks(tasks);
  renderDriverDashboard();
  showToast(task.completed ? 'Task marked complete' : 'Task marked pending');
}

function sendQuickMessage() {
  const message = document.getElementById('quick-message').value.trim();

  const messages = getMessages();
  messages.push({
    id: 'M' + Date.now(),
    fromUser: currentUser.driverId || 'driver',
    toUser: 'admin',
    content: message,
    type: 'driver-to-admin',
    sentAt: Date.now()
  });

  saveMessages(messages);
  document.getElementById('quick-message').value = '';
  showToast('Message sent to admin');
}
