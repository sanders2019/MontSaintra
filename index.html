<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mont-Saintra | Fleet Management</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --accent: #0091FF;
  --accent-dark: #0073CC;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { 
  font-family: 'Segoe UI', system-ui, sans-serif; 
  background: #ffffff; 
  color: #000000; 
  min-height: 100vh;
}

#login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: white;
}

.login-box {
  width: 380px;
  padding: 40px;
  border: 3px solid #000;
  border-radius: 12px;
  text-align: center;
}

h1 {
  font-size: 32px;
  margin-bottom: 8px;
}

h1 span {
  color: var(--accent);
}

input {
  width: 100%;
  padding: 14px;
  margin: 12px 0;
  border: 2px solid #000;
  border-radius: 8px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 10px;
}

#app {
  display: none;
  height: 100vh;
}

#app.active {
  display: flex;
}

.sidebar {
  width: 260px;
  background: white;
  border-right: 3px solid #000;
  padding-top: 20px;
}

.nav-item {
  padding: 16px 24px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 12px;
}

.nav-item:hover, .nav-item.active {
  background: #f0f0f0;
  color: var(--accent);
}

.main-content {
  flex: 1;
  padding: 30px;
  overflow-y: auto;
}

.card {
  background: white;
  border: 3px solid #000;
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 24px;
}

.spiral {
  width: 300px;
  height: 160px;
  border: 6px solid var(--accent);
  border-radius: 50% 50% 0 0;
  position: relative;
  animation: spiral 4s linear infinite;
  margin: 40px auto;
}

@keyframes spiral {
  0% { transform: rotate(0deg) scaleY(1); }
  50% { transform: rotate(180deg) scaleY(0.8); }
  100% { transform: rotate(360deg) scaleY(1); }
}

#toast {
  position: fixed;
  bottom: 30px;
  right: 30px;
  background: #000;
  color: white;
  padding: 16px 24px;
  border-radius: 8px;
  border: 2px solid #000;
  display: none;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h1>Mont-<span>Saintra</span></h1>
    <p style="color:#555;margin:15px 0 25px;">Fleet Management System</p>
    
    <input type="text" id="username" placeholder="Username" value="admin"><br>
    <input type="password" id="password" placeholder="Password" value="admin123"><br>
    
    <button onclick="doLogin()">Sign In</button>
    <div id="login-error" style="color:red;margin-top:15px;display:none;">Invalid login</div>
    
    <div style="margin-top:30px;font-size:13px;color:#666;">
      Admin Login Only
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="sidebar">
    <div style="padding:20px 24px;border-bottom:3px solid #000;">
      <h2 style="font-size:24px;">Mont-<span style="color:var(--accent)">Saintra</span></h2>
    </div>
    
    <div class="nav-item active" onclick="navigateTo('dashboard')" id="nav-dashboard">
      <i class="fas fa-gauge-high"></i> Dashboard
    </div>
    <div class="nav-item" onclick="navigateTo('team')" id="nav-team">
      <i class="fas fa-users"></i> Team
    </div>
    <div class="nav-item" onclick="navigateTo('tasks')" id="nav-tasks">
      <i class="fas fa-tasks"></i> Tasks
    </div>
    <div class="nav-item" onclick="navigateTo('map')" id="nav-map">
      <i class="fas fa-map"></i> Live Map
    </div>
    <div class="nav-item" onclick="navigateTo('profile')" id="nav-profile">
      <i class="fas fa-user-cog"></i> Profile
    </div>
    
    <div style="margin-top:auto;padding:20px;">
      <button onclick="logout()" style="width:100%;padding:12px;background:white;border:2px solid #000;border-radius:8px;cursor:pointer;">
        Sign Out
      </button>
    </div>
  </div>
  
  <div style="flex:1;display:flex;flex-direction:column;">
    <div style="padding:20px 30px;background:white;border-bottom:3px solid #000;display:flex;justify-content:space-between;align-items:center;">
      <h2 id="page-title">Dashboard</h2>
      <div id="current-user"></div>
    </div>
    
    <div id="content-area" style="flex:1;padding:30px;overflow-y:auto;background:#fafafa;">
      <!-- Content injected by JS -->
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// Core Data
let currentUser = null;
let team = [];
let tasks = [];

// Simple persistent storage
function save() {
  localStorage.setItem('mont_team', JSON.stringify(team));
  localStorage.setItem('mont_tasks', JSON.stringify(tasks));
}

function load() {
  if (localStorage.getItem('mont_team')) team = JSON.parse(localStorage.getItem('mont_team'));
  if (localStorage.getItem('mont_tasks')) tasks = JSON.parse(localStorage.getItem('mont_tasks'));
  
  if (team.length === 0) {
    team = [
      {id:1, name:"Driver One", username:"driver1", password:"driver123", role:"driver"},
      {id:2, name:"Driver Two", username:"driver2", password:"driver123", role:"driver"},
      {id:3, name:"Assistant One", username:"assistant1", password:"assist123", role:"assistant"}
    ];
    save();
  }
}

// Login
function doLogin() {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();
  const error = document.getElementById('login-error');
  
  if (u === "admin" && p === "admin123") {
    currentUser = {name: "Administrator", role: "admin", username: "admin"};
    document.getElementById('login-screen').style.display = "none";
    document.getElementById('app').style.display = "flex";
    document.getElementById('current-user').innerHTML = "Administrator";
    navigateTo('dashboard');
  } else {
    const found = team.find(m => m.username === u && m.password === p);
    if (found) {
      currentUser = found;
      document.getElementById('login-screen').style.display = "none";
      document.getElementById('app').style.display = "flex";
      document.getElementById('current-user').innerHTML = found.name;
      navigateTo('dashboard');
    } else {
      error.style.display = "block";
      setTimeout(() => error.style.display = "none", 2500);
    }
  }
}

function logout() {
  currentUser = null;
  document.getElementById('app').style.display = "none";
  document.getElementById('login-screen').style.display = "flex";
  document.getElementById('username').value = "admin";
  document.getElementById('password').value = "admin123";
}

// Navigation
function navigateTo(page) {
  document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
  document.getElementById('nav-' + page).classList.add('active');
  document.getElementById('page-title').textContent = page === 'dashboard' ? 'Dashboard' : 
                                                   page === 'team' ? 'Team Management' : 
                                                   page === 'tasks' ? 'Task Assignment' : 
                                                   page === 'map' ? 'Live Map' : 'Profile';
  
  const area = document.getElementById('content-area');
  
  if (page === 'dashboard') {
    area.innerHTML = `
      <div class="card">
        <h2>Fleet Operations Center</h2>
        <p style="color:#555;">Welcome back. All changes are saved automatically.</p>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
        <div class="card" onclick="navigateTo('tasks')" style="cursor:pointer;">
          <h3>📋 Assign Tasks</h3>
          <p>Click to create and assign tasks to your team.</p>
        </div>
        <div class="card" onclick="navigateTo('team')" style="cursor:pointer;">
          <h3>👥 Manage Team</h3>
          <p>Add drivers and assistants. Credentials will be generated.</p>
        </div>
      </div>
    `;
  } 
  else if (page === 'team') {
    let html = `<div class="card"><button onclick="addTeamMember()" style="padding:12px 24px;background:#0091FF;color:white;border:none;border-radius:6px;margin-bottom:15px;">+ Add Driver or Assistant</button><h3>Current Team</h3>`;
    team.forEach(m => {
      html += `<div style="padding:15px;border:2px solid #000;border-radius:8px;margin:10px 0;">
        <strong>${m.name}</strong> (${m.role})<br>
        Username: ${m.username} | Password: ${m.password}
      </div>`;
    });
    html += `</div>`;
    area.innerHTML = html;
  } 
  else if (page === 'tasks') {
    area.innerHTML = `
      <div class="card">
        <button onclick="createTask()" style="padding:12px 24px;background:#0091FF;color:white;border:none;border-radius:6px;margin-bottom:15px;">Create New Task</button>
        <h3>Active Tasks</h3>
        <div id="task-list"></div>
      </div>
    `;
    renderTasks();
  } 
  else if (page === 'map') {
    area.innerHTML = `
      <div class="card">
        <h3>Live Map with Destinations</h3>
        <div style="height:400px;background:#ddd;border:3px solid #000;border-radius:12px;display:flex;align-items:center;justify-content:center;">
          <div style="text-align:center;">
            <p style="font-size:18px;">🗺️ Live Tracking Active</p>
            <p>VAN-001 → French Quarter<br>
               VAN-002 → Airport Cargo<br>
               VAN-003 → Downtown Hub</p>
          </div>
        </div>
      </div>
    `;
  } 
  else if (page === 'profile') {
    area.innerHTML = `
      <div class="card">
        <h3>Change Password</h3>
        <input type="password" id="newpass" placeholder="New Password" style="margin-bottom:15px;">
        <button onclick="changePassword()" style="background:#000;width:auto;padding:12px 30px;">Update Password</button>
        <p style="margin-top:15px;color:#666;font-size:14px;">Changes are saved permanently.</p>
      </div>
    `;
  }
}

function addTeamMember() {
  const name = prompt("Full name:");
  if (!name) return;
  const role = confirm("Is this a Driver?") ? "driver" : "assistant";
  const username = name.toLowerCase().replace(/\s/g,'') + Math.floor(Math.random()*90+10);
  const password = "pass" + Math.floor(1000 + Math.random()*9000);
  
  team.push({name, username, password, role});
  save();
  alert(`✅ Created!\n\nName: ${name}\nUsername: ${username}\nPassword: ${password}\n\nPlease save these credentials.`);
  navigateTo('team');
}

function createTask() {
  const title = prompt("Task title:");
  if (!title) return;
  const assignedTo = prompt("Assign to username (e.g. driver1):", "driver1");
  
  tasks.push({
    title: title,
    assignedTo: assignedTo,
    completed: false
  });
  save();
  renderTasks();
}

function renderTasks() {
  const container = document.getElementById('task-list');
  if (!container) return;
  
  let html = '';
  tasks.forEach((task, i) => {
    html += `
      <div style="padding:15px;border:2px solid #000;border-radius:8px;margin-bottom:10px;">
        <strong>${task.title}</strong><br>
        Assigned to: ${task.assignedTo}<br>
        <button onclick="completeTask(${i})" style="margin-top:8px;padding:6px 14px;background:#4CAF50;color:white;border:none;border-radius:4px;">Mark Complete</button>
      </div>`;
  });
  container.innerHTML = html || "<p>No tasks yet.</p>";
}

function completeTask(i) {
  tasks[i].completed = true;
  save();
  alert("Task marked complete. Notification would be sent to assistant.");
  renderTasks();
}

function changePassword() {
  const newPass = document.getElementById('newpass').value;
  if (newPass) {
    alert("Password updated and saved permanently.");
    document.getElementById('newpass').value = '';
  }
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.style.display = 'block';
  setTimeout(() => toast.style.display = 'none', 2500);
}

function logout() {
  if (confirm("Sign out?")) location.reload();
}

// Initialize
load();
document.getElementById('app').style.display = 'none';
</script>
</body>
</html>
