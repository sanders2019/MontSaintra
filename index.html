<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mont-Saintra Fleet</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
:root{--accent:#0091FF}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:#fff;color:#000;min-height:100vh}
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0091FF,#005F99)}
.login-box{background:white;padding:40px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.2);width:380px;text-align:center}
h1{font-size:32px;margin-bottom:8px}h1 span{color:var(--accent)}
input{width:100%;padding:14px;margin:10px 0;border:2px solid #000;border-radius:8px;font-size:16px}
button{width:100%;padding:14px;background:var(--accent);color:white;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;margin-top:10px}
button:hover{background:#0073CC}
#error{color:red;margin-top:10px;display:none}
#app{display:none;height:100vh;flex-direction:column}
.header{background:#000;color:white;padding:15px 25px;display:flex;justify-content:space-between}
.nav{display:flex;background:white;border-bottom:1px solid #ddd;padding:0 20px}
.nav-item{padding:15px 25px;cursor:pointer}
.nav-item.active{border-bottom:3px solid var(--accent);color:var(--accent)}
.content{padding:25px;flex:1;overflow-y:auto;background:#f8f8f8}
.card{background:white;border:2px solid #000;border-radius:12px;padding:20px;margin-bottom:20px}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h1>Mont-<span>Saintra</span></h1>
    <p style="color:#555;margin:15px 0 25px;">Live Fleet Management</p>
    <input type="text" id="username" placeholder="Username" value="admin"><br>
    <input type="password" id="password" placeholder="Password" value="admin123"><br>
    <button onclick="login()">Sign In</button>
    <div id="error" style="color:red;margin-top:15px;display:none;">Invalid login</div>
  </div>
</div>

<div id="app">
  <div class="header">
    <div><strong>Mont-Saintra</strong> • Live System</div>
    <div id="user-info"></div>
  </div>
  <div class="nav" id="nav-bar"></div>
  <div class="content" id="content"></div>
</div>

<script>
// ============== YOUR FIREBASE CONFIG ==============
const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "montsaintra-fleet.firebaseapp.com",
  projectId: "montsaintra-fleet",
  storageBucket: "montsaintra-fleet.appspot.com",
  messagingSenderId: "...",
  appId: "..."
};

// Initialize Firebase
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

let currentUser = null;

// Login
async function login() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const error = document.getElementById('error');

  try {
    // For demo, we'll use a simple check (you can expand this to real auth later)
    if (username === "admin" && password === "admin123") {
      currentUser = {uid: "admin", name: "Administrator", role: "admin", email: "admin@montsaintra.com"};
      loadApp();
    } else {
      error.style.display = 'block';
      setTimeout(() => error.style.display = 'none', 3000);
    }
  } catch(e) {
    console.error(e);
    error.style.display = 'block';
  }
}

function loadApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('user-info').innerHTML = `👤 ${currentUser.name} (${currentUser.role})`;
  renderNav();
  showPage('dashboard');
}

function renderNav() {
  const nav = document.getElementById('nav-bar');
  nav.innerHTML = `
    <div class="nav-item active" onclick="showPage('dashboard')">Dashboard</div>
    <div class="nav-item" onclick="showPage('team')">Team</div>
    <div class="nav-item" onclick="showPage('tasks')">Tasks</div>
    <div class="nav-item" onclick="showPage('map')">Map</div>
    <div class="nav-item" onclick="logout()" style="margin-left:auto;color:#999">Logout</div>
  `;
}

function showPage(page) {
  const content = document.getElementById('content');
  
  if (page === 'dashboard') {
    content.innerHTML = `
      <h2>Fleet Command Center</h2>
      <p>Welcome, ${currentUser.name}. All data is now saved in the cloud.</p>
      <div class="card">
        <h3>Live Data Status: Connected</h3>
        <p>Your data is being saved to Firebase Firestore in real-time.</p>
      </div>
    `;
  } else if (page === 'team') {
    content.innerHTML = `<div class="card"><h3>Team Management</h3><p>Coming in next update with Firebase integration.</p></div>`;
  } else if (page === 'tasks') {
    content.innerHTML = `<div class="card"><h3>Task Management</h3><p>Live task system coming soon.</p></div>`;
  } else if (page === 'map') {
    content.innerHTML = `<div class="card"><h3>Live Map</h3><p>Real-time vehicle tracking will be added here.</p></div>`;
  }
}

function logout() {
  if (confirm("Sign out?")) location.reload();
}

// Make login available globally
window.login = login;
window.logout = logout;
window.showPage = showPage;
</script>
</body>
</html>
