<!DOCTYPE html>
<html>
<head>
<title>Mont-Saintra</title>
<style>
body { font-family: Arial; text-align:center; padding:50px; background:#f0f0f0; }
.box { background:white; max-width:400px; margin:40px auto; padding:40px; border:3px solid black; border-radius:12px; }
input { width:100%; padding:12px; margin:10px 0; font-size:16px; }
button { padding:15px; font-size:18px; background:#0091FF; color:white; border:none; width:100%; margin-top:10px; cursor:pointer; }
</style>
</head>
<body>

<div class="box">
  <h1>Mont-Saintra Fleet</h1>
  <p>Admin Login</p>
  
  <input type="text" id="u" value="admin" placeholder="Username"><br>
  <input type="password" id="p" value="admin123" placeholder="Password"><br>
  
  <button onclick="login()">SIGN IN</button>
</div>

<script>
function login() {
  const username = document.getElementById('u').value;
  const password = document.getElementById('p').value;
  
  if (username === "admin" && password === "admin123") {
    alert("✅ Login Successful!\n\nWelcome to the full version.");
    document.body.innerHTML = `
      <div style="padding:40px;text-align:center;">
        <h1>✅ Full Version Loaded</h1>
        <p>You are logged in as Administrator.</p>
        <button onclick="location.reload()" style="padding:15px 30px;font-size:16px;margin-top:20px;">Restart</button>
      </div>`;
  } else {
    alert("❌ Wrong username or password.\n\nTry: admin / admin123");
  }
}

// Press Enter to login
document.addEventListener('keypress', function(e) {
  if (e.key === "Enter") login();
});
</script>

</body>
</html>
